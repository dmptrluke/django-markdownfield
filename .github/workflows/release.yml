name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  lint:
    uses: dmptrluke/workflows/.github/workflows/django-lint.yml@main

  test:
    uses: dmptrluke/workflows/.github/workflows/django-test.yml@main
    with:
      matrix: >-
        [
          {"python": "3.10", "django": "5.2"},
          {"python": "3.12", "django": "5.2"},
          {"python": "3.14", "django": "5.2"},
          {"python": "3.12", "django": "6.0"},
          {"python": "3.14", "django": "6.0"},
          {"python": "3.12", "django": "6.1"},
          {"python": "3.13", "django": "6.1"},
          {"python": "3.14", "django": "6.1"}
        ]

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uvx hatch build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
