name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  lint:
    uses: dmptrluke/workflows/.github/workflows/django-lint.yml@main

  test:
    uses: dmptrluke/workflows/.github/workflows/django-test.yml@main
    with:
      matrix: >-
        [
          {"python": "3.10", "django": "5.2"},
          {"python": "3.12", "django": "5.2"},
          {"python": "3.14", "django": "5.2"},
          {"python": "3.12", "django": "6.0"},
          {"python": "3.14", "django": "6.0"},
          {"python": "3.12", "django": "6.1"},
          {"python": "3.13", "django": "6.1"},
          {"python": "3.14", "django": "6.1"}
        ]

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - run: uvx hatch build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
